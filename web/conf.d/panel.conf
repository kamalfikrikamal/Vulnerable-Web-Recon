# Internal Ops Panel - tidak pernah ditautkan dari situs utama maupun DNS.
# Hanya bisa ditemukan lewat port scanning (nmap) di port 8080.
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html/panel-internal;
    index index.html;

    add_header X-Powered-By "NusaCMS-Ops/0.9-internal" always;
}
