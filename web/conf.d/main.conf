# Situs utama PT Nusantara Data Kreasi (corplab.local)
# CATATAN LAB: dotfile (.git dsb) SENGAJA tidak diblok agar bisa jadi materi
# recon "exposed .git directory". Jangan tiru konfigurasi ini di produksi nyata.

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name corplab.local www.corplab.local _;

    ssl_certificate     /etc/nginx/certs/corplab.crt;
    ssl_certificate_key /etc/nginx/certs/corplab.key;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Powered-By "NusaCMS/2.3.1" always;
    add_header X-App-Env "production" always;
    add_header Set-Cookie "NUSACMS_SESSION=lab000000000000000000000000dead; Path=/" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/v1/status {
        default_type application/json;
        alias /usr/share/nginx/html/api/v1/status.json;
    }

    location /backup/ {
        autoindex on;
    }
}
