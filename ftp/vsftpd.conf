listen=YES
listen_ipv6=NO

anonymous_enable=YES
anon_root=/srv/ftp
no_anon_password=YES
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO
write_enable=NO
local_enable=NO

dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=127.0.0.1

anon_umask=022
secure_chroot_dir=/var/run/vsftpd/empty
seccomp_sandbox=NO

ftpd_banner=Welcome to Nusantara Data Kreasi internal FTP (vsftpd)
